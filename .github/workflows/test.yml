name: Test Composite Action

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - uses: ./
        with:
          source-repo: ${{ github.repository }}
          source-ref: ${{ github.sha }}
          database-name: "Test Database"
          database-desc: "Minimal schema for testing the composite action."
          migrations-path: test/migrations
          skip-publish: true
          # Dummy values to verify masking - if masking works these appear as *** in the log.
          bucket-access-key-id: "super-secret-key-id"
          bucket-secret-access-key: "super-secret-access-key"
          slack-bot-token: "super-secret-slack-token"

      # Verify that the dummy secret values are masked in log output.
      # Each echo should print *** - if the raw value appears, masking is broken.
      - name: Verify secret masking
        shell: bash
        run: |
          echo "bucket-access-key-id: super-secret-key-id"
          echo "bucket-secret-access-key: super-secret-access-key"
          echo "slack-bot-token: super-secret-slack-token"
