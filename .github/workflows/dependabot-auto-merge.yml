name: Dependabot auto-merge

on:
  workflow_call:
    secrets:
      AUTO_MERGE_NEURIS_APP_APP_ID:
        required: true
      AUTO_MERGE_NEURIS_APP_PRIVATE_KEY:
        required: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 #v3.1.0

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 #v3.2.0
        with:
          app-id: ${{ secrets.AUTO_MERGE_NEURIS_APP_APP_ID }}
          private-key: ${{ secrets.AUTO_MERGE_NEURIS_APP_PRIVATE_KEY }}

      - name: Auto-merge updates except major version updates
        if: |
          steps.dependabot-metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          for i in 1 2 3 4 5; do
            gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}" && break
            echo "Attempt $i failed. Retrying in 30s..."
            sleep 30
          done
